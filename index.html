<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Стеклобит</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Атмосферные звуки и биты из звуков стекла поверх анимации.">
<meta name="theme-color" content="#17110d">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: the animation fills the screen; panels hang on a twine like Vladimir's glass mosaics in wooden cutting-board frames (walnut = mixer, ochre = sequencer). Controls are glass shards set in dark grout. Single dark look on purpose. */
:root{
  --ink:#f3efe6;
  --ink-dim:#c4b9a6;
  --grout:rgba(18,14,12,.84);       /* dark grout / glass bed behind shards; opaque enough to need no backdrop blur, which would be redrawn on every video frame */
  --grout-solid:#17110d;
  --walnut:#6a3219; --walnut-deep:#40190a;
  --ochre:#dca42c;  --ochre-deep:#a8721a;
  --twine:#c8a46e;
  --pin:#e3c391;
  /* glass from the tiger & dragon */
  --g-tiger:#ec6a2a; --g-red:#c22b2b; --g-turq:#38b7cf; --g-leaf:#2c8a4a;
  --g-milk:#e6edf5;  --g-amber:#d6a43a; --g-ice:#a9d6ea;
  --edge:rgba(255,255,255,.16);
  --bg:#17110d;
  --f-display:"Russo One","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope","Segoe UI",system-ui,sans-serif;
  --f-hand:"Marck Script","Segoe Script",cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);overflow-x:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--g-amber);outline-offset:2px}

/* background */
/* the poster (first frame) shows at once; the video takes over silently once it can play.
   JS sizes #bg so both mosaic frames stay in view; a blurred thumbnail of the frame fills any leftover edges */
#bg{position:fixed;left:0;top:0;width:100%;height:100%;object-fit:fill;z-index:0;background:#2a2420}

.shade{position:fixed;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 30%,transparent 55%,rgba(0,0,0,.5));pointer-events:none;transition:opacity .4s}

/* shell */
.app{position:relative;z-index:2;min-height:100%;display:flex;flex-direction:column;gap:22px;
  padding-block:16px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  max-width:1100px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:400 clamp(26px,5.4vw,40px)/1 var(--f-display);margin:0;letter-spacing:.02em;display:flex;flex-wrap:wrap;gap:2px}
h1 .l{display:inline-block;padding:4px 3px 2px;background:var(--grout-solid);color:var(--c);
  clip-path:var(--shard);text-shadow:0 0 14px color-mix(in srgb,var(--c) 55%,transparent)}
h2{font:400 15px/1 var(--f-display);margin:0;letter-spacing:.06em;text-transform:uppercase}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;background:var(--grout);
  padding:9px 16px;cursor:pointer;font-weight:700;font-size:14px;border-radius:3px;
  clip-path:polygon(2% 8%,97% 0,100% 88%,4% 100%);box-shadow:inset 0 0 0 1px var(--edge)}
.btn:hover{background:rgba(40,30,24,.85)}

/* panels: wooden boards on a twine */
.pane{position:relative;margin-top:30px;border-radius:14px;padding:12px;
  background:
    repeating-linear-gradient(92deg,rgba(0,0,0,.0) 0 7px,rgba(0,0,0,.09) 7px 9px,rgba(255,255,255,.04) 9px 15px),
    linear-gradient(160deg,var(--wood),var(--wood-deep));
  box-shadow:0 14px 34px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18)}
.pane.walnut{--wood:var(--walnut);--wood-deep:var(--walnut-deep);--wood-ink:var(--ink)}
.pane.ochre{--wood:var(--ochre);--wood-deep:var(--ochre-deep);--wood-ink:#2a1606}
/* the handle with a hole, like the cutting boards */
.pane::before{content:"";position:absolute;left:50%;top:-30px;width:96px;height:42px;translate:-50% 0;
  border-radius:22px 22px 0 0;background:linear-gradient(160deg,var(--wood),var(--wood-deep));
  -webkit-mask:radial-gradient(circle 8px at 50% 15px,transparent 98%,#000 100%);mask:radial-gradient(circle 8px at 50% 15px,transparent 98%,#000 100%)}
/* the twine and the clothespin */
.pane::after{content:"";position:absolute;left:-40px;right:-40px;top:-17px;height:3px;rotate:-.5deg;z-index:-1;
  background:repeating-linear-gradient(60deg,var(--twine) 0 3px,#8f6c3d 3px 5px);border-radius:2px;opacity:.9}
.pin{position:absolute;left:50%;top:-40px;width:12px;height:34px;translate:-50% 0;rotate:6deg;border-radius:3px;
  background:linear-gradient(90deg,#b9925c,var(--pin) 45%,#b9925c);box-shadow:0 2px 4px rgba(0,0,0,.4);z-index:1}
.glass{background:var(--grout);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:14px;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.35),inset 0 2px 10px rgba(0,0,0,.5)}
.pane-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hand{font:22px/1.1 var(--f-hand);color:var(--ink-dim);margin:0}

/* mixer: one shard tile per sound */
.mixer{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ch{--c:var(--g-milk);padding:12px 14px;display:flex;flex-direction:column;gap:9px;background:rgba(255,255,255,.05);
  clip-path:var(--shard);transition:background .25s}
.ch.on{background:color-mix(in srgb,var(--c) 30%,transparent)}
.ch button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700}
.ch button:focus-visible{outline:2px solid var(--g-amber);outline-offset:3px;border-radius:4px}
.ch small{display:block;font-weight:400;color:var(--ink-dim);font-size:12px}
.dot{width:14px;height:14px;flex:none;background:rgba(255,255,255,.15);clip-path:polygon(50% 0,100% 45%,60% 100%,0 60%)}
.ch.on .dot{background:var(--c);filter:drop-shadow(0 0 6px var(--c))}
.ch.disabled{opacity:.45}
input[type=range]{width:100%;accent-color:var(--g-amber);margin:0}

/* sequencer */
.transport{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.play{width:56px;height:56px;border:0;background:var(--g-tiger);color:#2a0f04;cursor:pointer;display:grid;place-items:center;flex:none;
  clip-path:polygon(28% 2%,78% 0,100% 40%,88% 92%,34% 100%,0 62%,4% 20%)}
.play:hover{background:#ff7d3a}
.play svg{width:20px;height:20px;fill:currentColor}
.knob{display:flex;flex-direction:column;gap:4px;min-width:110px;flex:1;max-width:200px}
.knob label{font-size:12px;color:var(--ink-dim);display:flex;justify-content:space-between}
.knob output{font-variant-numeric:tabular-nums;color:var(--ink)}
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:12px 22px}
.bar{min-width:0;display:flex;flex-direction:column;gap:4px}
.bar-num{font-size:12px;color:var(--ink-dim);font-weight:700;letter-spacing:.04em}
.bars.one .bar-num{display:none}
.bar-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-dim)}
.bar-tools output{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.grid-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
.grid{display:grid;grid-template-columns:76px repeat(16,minmax(16px,1fr));gap:3px;min-width:380px}
.row-name{all:unset;cursor:pointer;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;padding-right:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-name::before{content:"";width:9px;height:9px;flex:none;background:var(--c);clip-path:polygon(50% 0,100% 45%,60% 100%,0 60%)}
.row-name.muted{color:var(--ink-dim);text-decoration:line-through}
.row-name.muted::before{opacity:.3}
.group{grid-column:1/-1;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);margin-top:8px}
.cell{appearance:none;border:0;padding:0;height:30px;background:rgba(255,255,255,.07);cursor:pointer;
  clip-path:var(--shard);transition:transform .08s,background .12s,filter .12s}
.cell.beat{background:rgba(255,255,255,.13)}
.cell.v1{background:var(--c)}
.cell.v2{background:color-mix(in srgb,var(--c) 48%,transparent)}
.cell.now{filter:brightness(1.6)}
.cell:not(.v1):not(.v2).now{background:rgba(255,255,255,.3)}
.cell.v1.now,.cell.v2.now{transform:scale(1.1)}
.cell.gap{margin-left:5px}
.hint{font-size:12.5px;color:var(--ink-dim);margin:0}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:rgba(255,255,255,.07);padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600;clip-path:var(--shard)}
.chip:hover{background:rgba(255,255,255,.16)}
.chip:disabled{opacity:.5;cursor:progress}
.chip.main{background:color-mix(in srgb,var(--g-amber) 32%,transparent)}
.chip.main:hover{background:color-mix(in srgb,var(--g-amber) 50%,transparent)}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.actions label{font-size:12.5px;color:var(--ink-dim);display:flex;align-items:center;gap:6px}
.actions select{font:inherit;font-size:13px;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid var(--edge);border-radius:4px;padding:4px 6px}
.actions select option{background:#2a1d14}
.act-note{font-size:12.5px;color:var(--ink-dim)}
.share-box{display:flex;gap:6px;align-items:center}
.share-box[hidden]{display:none}
.share-box input{flex:1;min-width:0;font:inherit;font-size:12.5px;color:var(--ink);background:rgba(0,0,0,.25);border:1px solid var(--edge);border-radius:4px;padding:6px 8px}

/* clean mode: only the animation */
body.clean .pane,body.clean .tools .hide-in-clean{display:none}
body.clean .shade{opacity:0}
.notice{font-size:13px;color:var(--ink-dim);background:var(--grout);border:1px dashed var(--edge);border-radius:6px;padding:8px 12px;margin:0}
@media (max-width:520px){.grid{grid-template-columns:62px repeat(16,minmax(15px,1fr))}.cell{height:26px}.cell.gap{margin-left:3px}.glass{padding:12px}.pane{padding:9px}}
@media (prefers-reduced-motion:reduce){.cell{transition:none}}
</style>
</head>

        <button class="chip" data-preset="video" type="button">Как в ролике</button>

        <button class="chip" data-preset="drops" type="button">Капли</button>
        <button class="chip" data-preset="bar" type="button">Барная стойка</button>
        <button class="chip" id="rand" type="button">Случайно</button>
        <button class="chip" id="clear" type="button">Очистить</button>
        <button class="chip main" id="undo" type="button" hidden>Отменить</button>
      </div>
    </div>
    <div class="transport">
      <button class="play" id="play" type="button" aria-label="Играть"><svg viewBox="0 0 20 20" id="playIcon"><path d="M5 3l12 7-12 7z"/></svg></button>
      <div class="knob"><label for="bpm">Темп <output id="bpmOut">84</output></label><input id="bpm" type="range" min="56" max="160" step="1"></div>

<script>
(() => {
/* ---------- state ---------- */
const BAR = 16, MAX_BARS = 8;   // one bar = 16 steps; the pattern can grow to 8 bars
const steps = () => state.grid[0].length;
const ROWS = [
  {id:'clink',  name:'Звон',        c:'var(--g-milk)'},
  {id:'bass',   name:'Бас',         c:'var(--g-leaf)'},
  {id:'crunch', name:'Хруст',       c:'var(--g-turq)'},
  {id:'ice',    name:'Лёд',         c:'var(--g-ice)'},
  {id:'small',  name:'Динь',        c:'var(--g-amber)'},
  {id:'rumble', name:'Гул',         c:'var(--g-tiger)'},
  // drum kit, synthesized
  {id:'kick',   name:'Бочка',       c:'var(--g-red)',   drum:true},
  {id:'snare',  name:'Малый',       c:'var(--g-milk)',  drum:true},
  {id:'hat',    name:'Хай-хэт',     c:'var(--g-amber)', drum:true},
  {id:'ride',   name:'Райд',        c:'var(--g-ice)',   drum:true},
  {id:'crash',  name:'Крэш',        c:'var(--g-turq)',  drum:true},
  {id:'tomHi',  name:'Том 1',       c:'var(--g-leaf)',  drum:true},
  {id:'tomLo',  name:'Том 2',       c:'var(--g-tiger)', drum:true},
];
const GLASS_ROWS = ROWS.findIndex(r=>r.drum);
const CHANNELS = [
  {id:'rain',  name:'Дождь по стеклу', sub:'шум и капли', c:'var(--g-turq)'},
  {id:'wind',  name:'Ветер',           sub:'за окном', c:'var(--g-ice)'},
  {id:'vinyl', name:'Пластинка',       sub:'треск винила', c:'var(--g-amber)'},
  {id:'sing',  name:'Поющий бокал',    sub:'палец по краю', c:'var(--g-leaf)'},
  {id:'video', name:'Звук из видео',   sub:'дорожка анимации', c:'var(--g-tiger)'},
];
const PRESETS = {
  video:{bpm:80,swing:0,rows:[   // the beat from the animation's own soundtrack
    '...x............',
    'xoxoxoxoxoxoxoxo',
    '......o..x.ox...',
    '................',
    '..............xo',
    'x...............']},
  lofi:{bpm:82,swing:.25,rows:[
    'x.....o.....x...',
    '........x.......',
    '....x.......x...',
    'o.o.o.o.o.o.o.oo',
    '..x...x...x...x.',
    'x......x..x.....',
    'x.........x.....',
    '....x.......x...',
    'x.o.x.o.x.o.x.oo',
    '................',
    '................',
    '................',
    '................']},
  drops:{bpm:70,swing:.1,rows:[
    'x...o...x..o....',
    '..........x.....',
    '................',
    'x..o..x..o..x..o',
    '................',
    'x.......x.......']},
  bar:{bpm:104,swing:.15,rows:[
    'x..x..x...x..x..',
    'x.......x..x....',
    '....x.......x..o',
    'xoxoxoxoxoxoxoxo',
    '..x...x...x...xx',
    'x..x....x.x.....',
    'x.....x...x.....',
    '....x.......x..o',
    '..x...x...x...x.',
    'x.o.x.o.x.o.x.o.',
    'x...............',
    '............x...',
    '.............xo.']},
};
/* old patterns and links have only the glass rows: the drum rows start empty */
const padRows = rows => ROWS.map((_,i)=>rows[i] || Array(rows[0].length).fill(0));
/* glass shards: each tile gets its own slightly irregular outline */
const j = m => (Math.random()*m).toFixed(1);
const shard = (m=9) => `polygon(${j(m)}% ${j(m)}%, ${100-j(m)}% ${j(m)}%, ${100-j(m)}% ${100-j(m)}%, ${j(m)}% ${100-j(m)}%)`;
const shard5 = (m=8) => `polygon(${j(m)}% ${j(m)}%, ${45+ +j(10)}% 0%, ${100-j(m)}% ${j(m)}%, ${100-j(m)}% ${100-j(m)}%, ${j(m)}% ${100-j(m)}%)`;
document.querySelectorAll('.btn,.chip').forEach(b=>b.style.setProperty('--shard',shard(5)));
{ const h=document.getElementById('title'), cols=['--g-tiger','--g-milk','--g-leaf','--g-amber','--g-turq','--g-red','--g-ice','--g-tiger','--g-leaf'];
  h.textContent=''; [...'Стеклобит'].forEach((ch,i)=>{ const s=document.createElement('span'); s.className='l'; s.setAttribute('aria-hidden','true'); s.textContent=ch;
    s.style.setProperty('--c',`var(${cols[i%cols.length]})`); s.style.setProperty('--shard',shard5(14)); h.appendChild(s); }); }
const parse = s => [...s].map(c => c==='x'?1:c==='o'?2:0);

const KEY = 'steklobit:v2';
let state = {
  bpm:80, swing:0, reverb:.35, seqVol:.8, loops:8, videoOff:false,
  mute:ROWS.map(()=>false),
  grid:padRows(PRESETS.video.rows.map(parse)),
  ch:Object.fromEntries(CHANNELS.map(c=>[c.id,{on:false,vol:.5}])),
};
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.grid) state = {...state, ...s, grid:padRows(s.grid), mute:ROWS.map((_,i)=>!!(s.mute||[])[i]), ch:{...state.ch, ...s.ch}}; } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} };
addEventListener('pagehide', save);

/* ---------- audio engine ---------- */
const AC = window.AudioContext || window.webkitAudioContext;
let ctx, master, verbSend, seqBus, noiseBuf, rowGain = [], chGain = {}, videoSrc = null;

function impulse(sec){
  const len = ctx.sampleRate*sec, b = ctx.createBuffer(2,len,ctx.sampleRate);
  for (let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);}
  return b;
}
function makeNoise(){
  const len = ctx.sampleRate*2, b = ctx.createBuffer(1,len,ctx.sampleRate), d=b.getChannelData(0);
  for (let i=0;i<len;i++) d[i]=Math.random()*2-1;
  return b;
}
let lastUse = 0;
function initAudio(){
  lastUse = Date.now();
  if (ctx) { if (ctx.state==='suspended') ctx.resume(); return; }
  ctx = new AC();
  buildGraph(0);
  loadSamples();
  CHANNELS.forEach(c=>applyChannel(c.id));
}
/* battery: a running audio context keeps the sound hardware awake, so it sleeps once everything is silent */
setInterval(()=>{
  if (ctx && ctx.state==='running' && !playing && Date.now()-lastUse>6000 && !CHANNELS.some(c=>state.ch[c.id].on)) ctx.suspend();
}, 3000);
/* the whole chain on the current ctx; dur>0 means an offline render of that many seconds */
function buildGraph(dur){
  master = ctx.createGain(); master.gain.value = .9;
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4;
  master.connect(comp); comp.connect(ctx.destination);
  const verb = ctx.createConvolver(); verb.buffer = impulse(2.8);
  verbSend = ctx.createGain(); verbSend.gain.value = state.reverb;
  verbSend.connect(verb); verb.connect(master);
  seqBus = ctx.createGain(); seqBus.gain.value = state.seqVol;
  seqBus.connect(master); seqBus.connect(verbSend);
  noiseBuf = makeNoise();
  rowGain = ROWS.map((r,i)=>{const g=ctx.createGain(); g.gain.value = state.mute[i]?0:1; g.connect(seqBus); return g;});
  setupAmbient(dur);
}

/* small building blocks */
function env(g,t,a,peak,d){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(peak,0.0002),t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);}
function partial(f,t,peak,decay,out){
  const o=ctx.createOscillator(), g=ctx.createGain();
  o.frequency.value=f; env(g,t,0.002,peak,decay); o.connect(g); g.connect(out); o.start(t); o.stop(t+decay+0.05);
}
function noiseHit(t,peak,decay,type,freq,Q,out){
  const s=ctx.createBufferSource(), f=ctx.createBiquadFilter(), g=ctx.createGain();
  s.buffer=noiseBuf; f.type=type; f.frequency.value=freq; f.Q.value=Q; env(g,t,0.001,peak,decay);
  s.connect(f); f.connect(g); g.connect(out); s.start(t,Math.random()*Math.max(0,1.9-decay)); s.stop(t+decay+0.05);
}
const rnd = (a,b)=>a+Math.random()*(b-a);

/* glass instruments: (time, velocity, output) */
/* one-shots cut from the animation's soundtrack */
const SMP = {};
function loadSamples(c=ctx){
  let data = {}; try { data = JSON.parse(document.getElementById('samples').textContent); } catch(e){}
  return Promise.all(Object.entries(data).filter(([k])=>!SMP[k]).map(([k,b64])=>new Promise(done=>{
    const bin = atob(b64), buf = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
    try { c.decodeAudioData(buf.buffer, b=>{ SMP[k]=b; done(); }, done); } catch(e){ done(); }
  })));
}
function sample(k,t,v,out,fallback){
  if (!SMP[k]) return fallback(t,v,out);
  const s=ctx.createBufferSource(), g=ctx.createGain(); s.buffer=SMP[k]; g.gain.value=v*.9;
  s.connect(g); g.connect(out); s.start(t);
}
const INST = {
  clink(t,v,out){ sample('clink',t,v,out,INST.glass); },
  bass(t,v,out){ sample('bass',t,v,out,INST.bottle); },
  crunch(t,v,out){ sample('crunch',t,v,out,INST.tap); },
  small(t,v,out){ sample('small',t,v,out,INST.shards); },
  rumble(t,v,out){ sample('rumble',t,v,out,INST.vase); },
  glass(t,v,out){ // wine glass clink: inharmonic partials
    const base = 1650*rnd(.995,1.005);
    [[1,.35,1.4],[2.32,.18,.9],[4.25,.1,.5],[6.63,.05,.3]].forEach(([r,p,d])=>partial(base*r,t,p*v,d,out));
    noiseHit(t,.12*v,.012,'highpass',6000,.7,out);
  },
  bottle(t,v,out){ // blown / tapped bottle
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.frequency.setValueAtTime(300,t); o.frequency.linearRampToValueAtTime(330,t+.08);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(.3*v,t+.03); g.gain.exponentialRampToValueAtTime(0.0001,t+.4);
    o.connect(g); g.connect(out); o.start(t); o.stop(t+.45);
    noiseHit(t,.6*v,.3,'bandpass',330,25,out);
  },
  tap(t,v,out){ // knuckle on a window pane
    partial(3150,t,.25*v,.06,out); partial(4700,t,.12*v,.04,out);
    noiseHit(t,.35*v,.02,'bandpass',4000,2,out);
  },
  ice(t,v,out){ // ice cubes in a glass
    for (let k=0;k<3;k++){const dt=t+k*.025+rnd(0,.012);

/* ambient layers */
function loopNoise(){const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true; s.start(); return s;}
function setupAmbient(dur){
  CHANNELS.forEach(c=>{const g=ctx.createGain(); g.gain.value=0; g.connect(master); chGain[c.id]=g;});
  chGain.rain.connect(verbSend);

  // rain: broad filtered noise + random droplets on glass
  { const n=loopNoise(), bp=ctx.createBiquadFilter(), lp=ctx.createBiquadFilter(), g=ctx.createGain();
    bp.type='bandpass'; bp.frequency.value=1500; bp.Q.value=.5; lp.type='lowpass'; lp.frequency.value=6000; g.gain.value=.35;
    n.connect(bp); bp.connect(lp); lp.connect(g); g.connect(chGain.rain);
    const drop = t=>{ if (Math.random()<.45) partial(rnd(2000,5000),t+rnd(.01,.08),rnd(.02,.07),.03,chGain.rain); };
    if (dur) { if (state.ch.rain.on) for (let t=0;t<dur;t+=.07) drop(t); }
    else setInterval(()=>{ if(state.ch.rain.on && ctx.state==='running') drop(ctx.currentTime); },70);
  }
  // wind: low noise with slowly moving filter
  { const n=loopNoise(), lp=ctx.createBiquadFilter(), lfo=ctx.createOscillator(), depth=ctx.createGain(), g=ctx.createGain();
    lp.type='lowpass'; lp.frequency.value=500; lp.Q.value=3; lfo.frequency.value=.08; depth.gain.value=320; g.gain.value=.9;
    lfo.connect(depth); depth.connect(lp.frequency); lfo.start();

  }
  // vinyl: sparse crackle + faint hiss
  { const len=ctx.sampleRate*4, b=ctx.createBuffer(1,len,ctx.sampleRate), d=b.getChannelData(0);
    for (let i=0;i<len;i++){ d[i]=(Math.random()*2-1)*.012; if(Math.random()<.0004) d[i]=(Math.random()*2-1)*rnd(.3,1); }
    const s=ctx.createBufferSource(), hp=ctx.createBiquadFilter(); s.buffer=b; s.loop=true; hp.type='highpass'; hp.frequency.value=900;
    s.connect(hp); hp.connect(chGain.vinyl); s.start();
  }
  // singing glass: two close sines beating + overtone, slow tremolo
  { const trem=ctx.createGain(), lfo=ctx.createOscillator(), lg=ctx.createGain(), lp=ctx.createBiquadFilter();
    trem.gain.value=.12; lfo.frequency.value=.22; lg.gain.value=.05; lfo.connect(lg); lg.connect(trem.gain); lfo.start();
    lp.type='lowpass'; lp.frequency.value=3000;
    [[784,1],[786.5,.8],[1568,.25]].forEach(([f,a])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.value=a;o.connect(g);g.connect(trem);o.start();});
    trem.connect(lp); lp.connect(chGain.sing); chGain.sing.connect(verbSend);

}

const FRAMES = {x0:.20, x1:.69, y0:.07, y1:.94};
function fitBox(el, vw, vh){
  const W=innerWidth, H=innerHeight, box=FRAMES;
  let s=Math.max(W/vw, H/vh);
  if (W>H) s=Math.min(s, W/((box.x1-box.x0)*vw), H/((box.y1-box.y0)*vh));
  const w=vw*s, h=vh*s;
  const place=(size,view,center)=> size<=view ? Math.min(view-size, Math.max(0, view/2-center)) : Math.min(0, Math.max(view-size, view/2-center));
  Object.assign(el.style,{width:w+'px',height:h+'px',left:place(w,W,(box.x0+box.x1)/2*w)+'px',top:place(h,H,(box.y0+box.y1)/2*h)+'px'});
  return w>=W-1 && h>=H-1;
}

/* ---------- scheduler ---------- */
const stepDur = ()=>60/state.bpm/4;
function schedule(){
  while (nextT < ctx.currentTime + .12){
    if (cur>=steps()) cur=0;   // a bar was removed while playing
    const t = nextT + (cur%2 ? stepDur()*state.swing : 0);
    ROWS.forEach((r,ri)=>{ const v=state.grid[ri][cur]; if (v) INST[r.id](t, v===1?1:.45, rowGain[ri]); });
    queue.push({s:cur,t}); nextT += stepDur(); cur=(cur+1)%steps();
  }

  if (!playing) return;

  requestAnimationFrame(draw);

  if (shown>=0) cells.forEach(row=>row[shown] && row[shown].classList.remove('now'));
  shown=s; if (s>=0) cells.forEach(row=>row[s] && row[s].classList.add('now'));

/* ---------- export: the same graph rendered offline, saved as WAV ---------- */
const actNote=document.getElementById('actNote');
const note=t=>{ actNote.textContent=t; };
async function renderBeat(loops){
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const sr = 44100, loopDur = BAR*stepDur(), tail = 3.5, dur = loops*loopDur + tail;
  const off = new OAC(2, Math.ceil(dur*sr), sr);
  await loadSamples(off);
  // swap the engine onto the offline context; everything below runs synchronously, so live timers never see it
  const live = {ctx, master, verbSend, seqBus, noiseBuf, rowGain, chGain};
  try {
    ctx = off; chGain = {}; buildGraph(dur);
    CHANNELS.forEach(c=>{ const on = c.id!=='video' && state.ch[c.id].on, g = chGain[c.id].gain;
      if (!on) return;
      g.setValueAtTime(0,0); g.linearRampToValueAtTime(state.ch[c.id].vol,.4);
      g.setValueAtTime(state.ch[c.id].vol,dur-tail); g.linearRampToValueAtTime(0,dur-.2); });
    for (let n=0, t0=.02; n<loops*BAR; n++, t0+=stepDur()){
      const s=n%steps(), t=t0+(s%2 ? stepDur()*state.swing : 0);
      ROWS.forEach((r,ri)=>{ const v=state.grid[ri][s]; if (v) INST[r.id](t, v===1?1:.45, rowGain[ri]); });
    }
  } finally { ({ctx, master, verbSend, seqBus, noiseBuf, rowGain, chGain} = live); }

}

  let peak = 0; chans.forEach(d=>{ for (let i=0;i<len;i++) peak=Math.max(peak,Math.abs(d[i])); });
  const k = peak>.98 ? .98/peak : 1;
  for (let i=0,o=44;i<len;i++) for (let c=0;c<ch;c++,o+=2){ const v=Math.max(-1,Math.min(1,chans[c][i]*k)); data.setInt16(o, v<0?v*0x8000:v*0x7fff, true); }
  return new Uint8Array(data.buffer);
}
/* a zip with one stored file: the claude.ai viewer saves zip but not wav */
function zip1(name, bytes){
  const crcT = [...Array(256)].map((_,n)=>{ for (let k=0;k<8;k++) n = n&1 ? 0xEDB88320^(n>>>1) : n>>>1; return n>>>0; });
  let crc = -1; for (let i=0;i<bytes.length;i++) crc = crcT[(crc^bytes[i])&255]^(crc>>>8); crc = (crc^-1)>>>0;
  const fn = new TextEncoder().encode(name), lh = new DataView(new ArrayBuffer(30)), cd = new DataView(new ArrayBuffer(46)), end = new DataView(new ArrayBuffer(22));
  lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint32(14,crc,true); lh.setUint32(18,bytes.length,true); lh.setUint32(22,bytes.length,true); lh.setUint16(26,fn.length,true);
  cd.setUint32(0,0x02014b50,true); cd.setUint16(4,20,true); cd.setUint16(6,20,true); cd.setUint32(16,crc,true); cd.setUint32(20,bytes.length,true); cd.setUint32(24,bytes.length,true); cd.setUint16(28,fn.length,true);
  end.setUint32(0,0x06054b50,true); end.setUint16(8,1,true); end.setUint16(10,1,true); end.setUint32(12,46+fn.length,true); end.setUint32(16,30+fn.length+bytes.length,true);
  return new Blob([lh,fn,bytes,cd,fn,end],{type:'application/zip'});
}
const exportBtn=document.getElementById('export');
exportBtn.addEventListener('click', async ()=>{
  const bars = steps()/BAR, loops = Math.ceil(+document.getElementById('loops').value/bars)*bars;   // whole passes of the pattern
  exportBtn.disabled = true; note('Свожу бит…');
  try {
    const buf = await renderBeat(loops), bytes = wav(buf);
    const name = `steklobit-${state.bpm}bpm.wav`, secs = Math.round(buf.duration);
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads').catch(()=>null) : null;
    if (dl) {
      try { await dl.save({filename: name.replace('.wav','.zip'), data: zip1(name, bytes)}); note(`Готово: ${secs} с, WAV в архиве`); }
      catch(e){ note(e && e.code==='declined' ? '' : 'Не получилось сохранить файл'); }
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([bytes],{type:'audio/wav'})); a.download = name;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 60000);
      note(`Готово: ${secs} с, WAV`);
    }
  } catch(e){ note('Не получилось свести бит'); console.error(e); }
  exportBtn.disabled = false;
});

/* ---------- share: the beat lives in the link's #hash ---------- */
const SHARE_TEXT = 'Послушай мой бит из стекла —';
const PAGE_URL = 'https://tastex.github.io/steklobit/';
const CODE = '.xo';
function encodeBeat(){
  const q = new URLSearchParams();
  q.set('t', state.bpm); q.set('sw', Math.round(state.swing*100)); q.set('e', Math.round(state.reverb*100)); q.set('v', Math.round(state.seqVol*100));
  q.set('g', state.grid.map(r=>r.map(v=>CODE[v]).join('')).join('-'));
  if (state.mute.some(Boolean)) q.set('m', state.mute.map(m=>m?1:0).join(''));
  const amb = CHANNELS.filter(c=>c.id!=='video' && state.ch[c.id].on).map(c=>c.id+'.'+Math.round(state.ch[c.id].vol*100));
  if (amb.length) q.set('a', amb.join('-'));
  return q.toString();
}
let pendingAmb = [];
function decodeBeat(hash){
  const q = new URLSearchParams(hash.replace(/^#/,'')), g = (q.get('g')||'').split('-');
  if ((g.length!==ROWS.length && g.length!==GLASS_ROWS) || g.some(r=>r.length!==g[0].length || r.length%BAR || r.length>BAR*MAX_BARS || !/^[.xo]+$/.test(r))) return false;
  const num = (k,lo,hi,def)=>{ const v=parseFloat(q.get(k)); return isFinite(v) ? Math.min(hi,Math.max(lo,v)) : def; };
  state.grid = padRows(g.map(r=>[...r].map(c=>CODE.indexOf(c))));
  state.bpm = Math.round(num('t',56,160,state.bpm)); state.swing = num('sw',0,50,state.swing*100)/100;
  state.reverb = num('e',0,100,state.reverb*100)/100; state.seqVol = num('v',0,100,state.seqVol*100)/100;
  const m = q.get('m')||''; state.mute = ROWS.map((_,i)=>m[i]==='1');
  pendingAmb = [];
  (q.get('a')||'').split('-').forEach(x=>{ const [id,v]=x.split('.'); if (state.ch[id] && id!=='video'){ state.ch[id].vol=Math.min(1,Math.max(0,(+v||50)/100)); pendingAmb.push(id); } });
  return true;
}
function applyLink(){
  const mine = snapshot();
  if (!decodeBeat(location.hash)) return;
  if (mine!==snapshot()) remember(mine);   // your own beat stays one «Отменить» away
  refreshSeq();
  CHANNELS.forEach(c=>{ document.getElementById('vol-'+c.id).value = state.ch[c.id].vol; if (state.ch[c.id].on && !pendingAmb.includes(c.id)){ state.ch[c.id].on=false; paintChannel(c.id); applyChannel(c.id); } });
  save();
  note(undo.length ? 'Бит из ссылки загружен. Нажмите ▶, чтобы послушать, или «Отменить», чтобы вернуть свой' : 'Бит из ссылки загружен. Нажмите ▶, чтобы послушать');
  try { history.replaceState(null,'',location.pathname+location.search); } catch(e){}   // later edits are not overwritten on reload
}
/* sounds from the link switch on with the first play: browsers do not allow sound before a tap */
playBtn.addEventListener('click',()=>{ pendingAmb.forEach(id=>{ if (!state.ch[id].on){ state.ch[id].on=true; paintChannel(id); applyChannel(id); } }); pendingAmb=[]; });
applyLink();
addEventListener('hashchange', applyLink);

const shareBox=document.getElementById('shareBox'), shareUrl=document.getElementById('shareUrl');
const ownUrl = /^https?:$/.test(location.protocol) && /(^|\.)github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname);
/* the text with the link is copied at once (and offered to the phone's share menu); the field below keeps it in view in case the clipboard is blocked */
async function copyMsg(){
  shareUrl.select();
  try { await navigator.clipboard.writeText(shareUrl.value); }
  catch(e){ try { if (!document.execCommand('copy')) throw e; } catch(_){ note('Скопируйте текст из поля ниже'); return; } }
  note('Текст со ссылкой скопирован');
}
document.getElementById('share').addEventListener('click', ()=>{
  const url = (ownUrl ? location.origin+location.pathname : PAGE_URL) + '#' + encodeBeat();
  shareUrl.value = SHARE_TEXT + ' ' + url; shareBox.hidden = false; shareUrl.focus();
  const copied = copyMsg();
  if (navigator.share && matchMedia('(pointer: coarse)').matches)
    navigator.share({title:'Стеклобит', text:shareUrl.value}).catch(()=>{}).then(()=>copied);
});
document.getElementById('copy').addEventListener('click', copyMsg);

/* clean mode */
const cleanBtn=document.getElementById('clean');
cleanBtn.addEventListener('click',()=>{ const on=document.body.classList.toggle('clean'); cleanBtn.textContent=on?'Показать панели':'Скрыть панели'; });
})();
</script>
